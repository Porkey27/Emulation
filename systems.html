<body>
  <nav class="topbar">
    <div class="tabs">
      <a class="tab" href="index.html">Home</a>

    </div>

  <main class="page">
    <div class="page-head">
      <h1>SYSTEMS</h1>
      <span class="count-pill" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="js/nas-config.js"></script>
  <script src="js/renderer.js"></script>
  <script>
    loadNasData(() => {
      const items = SYSTEMS.map((s) => ({
        title: s.short,
        image: s.image,
        sub: s.emulator,
        accent: s.accent,
        href: `console.html?system=${encodeURIComponent(s.id)}`,
      }));

      document.getElementById("count").textContent = `${items.length} SYSTEMS`;
      renderGrid(document.getElementById("grid"), items);
    });
  </script>
