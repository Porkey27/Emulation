<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Systems</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="topbar">
    <div class="tabs">
      <a class="tab" href="index.html">Home</a>
      <a class="tab active" href="systems.html">Systems</a>
    </div>
  </nav>

  <main class="page">
    <div class="page-head">
      <h1>SYSTEMS</h1>
      <span class="count-pill" id="count"></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/renderer.js"></script>
  <script>
    const items = SYSTEMS.map((s) => ({
      title: s.short,
      image: s.image,
      sub: s.emulator,
      accent: s.accent,
      href: `console.html?system=${encodeURIComponent(s.id)}`,
    }));

    document.getElementById("count").textContent = `${items.length} SYSTEMS`;
    renderGrid(document.getElementById("grid"), items);
  </script>
</body>
</html>
